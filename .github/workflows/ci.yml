name: CI

on:
  push:
  pull_request:

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db

      DATABASE_URL: postgresql+asyncpg://user:password@localhost:5433/db
      TEST_DATABASE_URL: postgresql+asyncpg://user:password@localhost:5434/test_db

      SECRET_KEY: test-secret-key
      ALGORITHM: HS256

      REDIS_URL: redis://localhost:6379

      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_FROM: noreply@online-cinema.local

      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_ENDPOINT: localhost:9000
      MINIO_BUCKET: avatars

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Check formatting with Black
        run: poetry run black --check .

      - name: Run Flake8
        run: poetry run flake8 .

      - name: Run mypy
        run: poetry run mypy app

      - name: Start test database
        run: docker compose up -d test_db

      - name: Run tests with coverage
        run: >
          poetry run pytest
          --cov=app
          --cov-report=term-missing
          --cov-fail-under=90